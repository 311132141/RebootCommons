server {
    listen 80;
    server_name www.reboottoolbox.com reboottoolbox.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://www.reboottoolbox.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.reboottoolbox.com;
    ssl_certificate /etc/letsencrypt/live/www.reboottoolbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.reboottoolbox.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RebootToolboxTLS:10m;
    ssl_session_timeout 1d;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
